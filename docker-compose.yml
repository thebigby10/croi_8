services:
  app:
    build: .
    ports:
      - "9000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
